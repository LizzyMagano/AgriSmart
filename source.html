<!DOCTYPE html>
<html>
<head>
  <title>AgriSmart Botswana</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
      background-image: url('background.jpg'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    header {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
      margin: 20px;
    }

    h1 {
      color: #ffd700;
      margin-bottom: 5px;
    }

    p.subtitle {
      margin-top: 0;
      font-size: 16px;
      color: #ddd;
    }

    .lang-btn {
      margin-top: 15px;
      padding: 8px 16px;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    
    .lang-btn:hover {
      background: #00cca3;
    }

    /* Navigation styling */
    nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px;
    }

    nav a {
      background: rgba(0, 0, 0, 0.6);
      color: #00ffcc;
      text-decoration: none;
      padding: 15px;
      margin: 8px;
      width: 250px;
      border-radius: 8px;
      font-size: 18px;
      transition: background 0.3s;
      border: 1px solid rgba(0, 255, 204, 0.3);
    }

    nav a:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #ffd700;
      border: 1px solid #ffd700;
    }

    /* Video Section */
    .video-section {
      background: rgba(0, 0, 0, 0.6);
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
    }
    
    .video-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .video-card {
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 10px;
      width: 100%;
      max-width: 560px;
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      border: none;
    }

    /* Footer / Home Button Styling */
    footer {
      background: rgba(0, 0, 0, 0.6);
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
    }

    .home-btn {
      background: #ffd700;
      color: #000;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      transition: background 0.3s;
      display: inline-block;
    }

    .home-btn:hover {
      background: #e6c200;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="mainTitle">AgriSmart Botswana</h1>
    <p class="subtitle" id="subTitle">Data-Driven Decision Support for Sustainable Crop & Water Management</p>
    <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">Setswana</button>
  </header>

  <!-- Navigation to other pages -->
  <nav>
    <a href="climate-crops-soil.html" id="link1">Climate • Crops • Soil</a>
    <a href="calendar.html" id="link2">Farming Calendar</a>
    <a href="analyse.html" id="link3">Analyse My Farm</a>
    <a href="decision.html" id="link4">Farming Decision Guide</a>
    <a href="dashboards.html" id="link5">Agricultural Dashboards</a>
    <a href="myfarm.html" id="link6">My Farm</a>
    <a href="about.html" id="link7">Research & Data Sources</a>
  </nav>

  <!-- Video Section (Videos Only) -->
  <div class="video-section">
    <div class="video-grid">
      
      <!-- Video 1 -->
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/Xxzvj2f7mkU" allowfullscreen></iframe>
      </div>

      <!-- Video 2 -->
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/_7fbLCybTwk" allowfullscreen></iframe>
      </div>

    </div>
  </div>

  <!-- Footer with Home Button -->
  <footer>
    <a href="index.html" class="home-btn" id="homeBtn">Home</a>
  </footer>

  <script>
    let lang = localStorage.getItem("language") || "en";

    const translations = {
      en: {
        title: "AgriSmart Botswana",
        subtitle: "Data-Driven Decision Support for Sustainable Crop & Water Management",
        btnText: "Setswana",
        link1: "Climate • Crops • Soil",
        link2: "Farming Calendar",
        link3: "Analyse My Farm",
        link4: "Farming Decision Guide",
        link5: "Agricultural Dashboards",
        link6: "My Farm",
        link7: "Research & Data Sources",
        homeBtn: "Home"
      },
      tn: {
        title: "AgriSmart Botswana",
        subtitle: "Tshegetso ya Ditshwetso ka Datha go ya ka Temo le Metsi",
        btnText: "English",
        link1: "Tlelaemete • Dijalo • Mmu",
        link2: "Khalendara ya Temo",
        link3: "Sekaseka Polasi Ya Me",
        link4: "Kaelo ya Ditshwetso tsa Temo",
        link5: "Diboto tsa Temo",
        link6: "Polasi Ya Me",
        link7: "Dipatlisiso le Metswedi ya Datha",
        homeBtn: "Gae"
      }
    };

    function updateLanguage() {
      const t = translations[lang];
      
      document.getElementById("mainTitle").textContent = t.title;
      document.getElementById("subTitle").textContent = t.subtitle;
      document.getElementById("langBtn").textContent = t.btnText;
      
      document.getElementById("link1").textContent = t.link1;
      document.getElementById("link2").textContent = t.link2;
      document.getElementById("link3").textContent = t.link3;
      document.getElementById("link4").textContent = t.link4;
      document.getElementById("link5").textContent = t.link5;
      document.getElementById("link6").textContent = t.link6;
      document.getElementById("link7").textContent = t.link7;
      
      document.getElementById("homeBtn").textContent = t.homeBtn;
    }

    function toggleLanguage() {
      lang = (lang === "en") ? "tn" : "en";
      localStorage.setItem("language", lang);
      updateLanguage();
    }

    updateLanguage();
  </script>

</body>
</html>
