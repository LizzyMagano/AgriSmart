<!DOCTYPE html>
<html>
<head>
    <title>AgriSmart Botswana - Analyse My Farm</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: -1;
        }

        header,
        section,
        footer {
            background: rgba(0,0,0,0.5);
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
        }

        h1, h2, h3 {
            color: #ffd700;
        }

        select,
        input {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        input[type="submit"] {
            cursor: pointer;
            background: #ffd700;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            background: #ffd700;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        a {
            color: #00ffcc;
            text-decoration: none;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 5px 0;
        }

        #results {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1 id="mainTitle">Analyse My Farm</h1>
</header>

<section>

    <form id="farmForm">

        <label id="districtLabel">
            District:
        </label>

        <select id="district">
            <option>Kgalagadi</option>
            <option>Ghanzi</option>
            <option>Chobe</option>
            <option>North West</option>
            <option>Central</option>
            <option>Southern</option>
            <option>Kweneng</option>
            <option>Kgatleng</option>
            <option>South East</option>
            <option>North East</option>
            <option>Northern</option>
        </select>

        <br><br>

        <input type="submit" id="analyseBtn" value="Analyse Farm">

    </form>

</section>

<section id="results"></section>

<footer>
    <a href="index.html" id="homeLink">Home</a> |
    <a href="calendar.html" id="calendarLink">Farming Calendar</a>
</footer>

<script>

const lang = localStorage.getItem("language") || "en";

const UI = {

    en: {
        title: "Analyse My Farm",
        districtLabel: "District:",
        analyseBtn: "Analyse Farm",
        homeLink: "Home",
        calendarLink: "Farming Calendar",
        analysing: "<h2>Analysing farm conditions...</h2>",
        errorTitle: "Error",
        connectionErrorTitle: "Connection Error",
        connectionErrorText: "Could not connect to AgriSmart analysis services.",
        aiAdvice: "AI Farm Advice",
        yearsAnalysed: "Years Analysed:",
        rainfallConditions: "Rainfall Conditions:",
        temperatureConditions: "Temperature Conditions:",
        droughtRisk: "Drought Risk:",
        heatRisk: "Heat Risk:",
        floodRisk: "Flood Risk:",
        rainfallTrend: "Rainfall Trend:",
        temperatureTrend: "Temperature Trend:",
        recommendedCrops: "Recommended Crops",
        recommendedPractices: "Recommended Farming Practices",
        analyseAnother: "Analyse Another District"
    },

    tn: {
        title: "Sekaseka Polasi Ya Me",
        districtLabel: "Kgaolo:",
        analyseBtn: "Sekaseka Polasi",
        homeLink: "Gae",
        calendarLink: "Khalendara ya Temo",
        analysing: "<h2>Go sekaseka maemo a polasi...</h2>",
        errorTitle: "Phoso",
        connectionErrorTitle: "Phoso ya Kgolagano",
        connectionErrorText: "Ga go a kgonwa go golagana le ditirelo tsa tlhatlhobo tsa AgriSmart.",
        aiAdvice: "Kaelo ya Polasi ya AI",
        yearsAnalysed: "Dingwaga tse di Sekasekilweng:",
        rainfallConditions: "Maemo a Pula:",
        temperatureConditions: "Maemo a Mogote:",
        droughtRisk: "Kotsi ya Leuba:",
        heatRisk: "Kotsi ya Mogote:",
        floodRisk: "Kotsi ya Kgogola:",
        rainfallTrend: "Mokgwa wa Pula:",
        temperatureTrend: "Mokgwa wa Mogote:",
        recommendedCrops: "Dijalo Tse di Tshitshintsweng",
        recommendedPractices: "Mekgwa ya Temo e e Tshitshintsweng",
        analyseAnother: "Sekaseka Kgaolo e Nngwe"
    }
};

const t = UI[lang] || UI.en;

document.getElementById("mainTitle").textContent = t.title;
document.getElementById("districtLabel").textContent = t.districtLabel;
document.getElementById("analyseBtn").value = t.analyseBtn;
document.getElementById("homeLink").textContent = t.homeLink;
document.getElementById("calendarLink").textContent = t.calendarLink;

async function analyseFarm(district) {

    const response = await fetch(
        "https://agrismart-1-t47g.onrender.com/analyse",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                district: district,
                language: lang
            })
        }
    );

    return await response.json();
}

document.getElementById("farmForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const district =
        document.getElementById("district").value;

    const results =
        document.getElementById("results");

    results.style.display = "block";

    results.innerHTML = t.analysing;

    try {

        const climate =
            await analyseFarm(district);

        if (climate.error) {

            results.innerHTML = `
                <h2>${t.errorTitle}</h2>
                <p>${climate.error}</p>
            `;

            return;
        }

        results.innerHTML = `

            <h2>${climate.district}</h2>

            <h3>${t.aiAdvice}</h3>

            <p>${climate.ai_advice}</p>

            <hr>

            <p>
                <strong>${t.yearsAnalysed}</strong>
                ${climate.years_analysed}
            </p>

            <p>
                <strong>${t.rainfallConditions}</strong>
                ${climate.rainfall_category}
            </p>

            <p>
                <strong>${t.temperatureConditions}</strong>
                ${climate.temperature_category}
            </p>

            <p>
                <strong>${t.droughtRisk}</strong>
                ${climate.drought_risk}
            </p>

            <p>
                <strong>${t.heatRisk}</strong>
                ${climate.heat_risk}
            </p>

            <p>
                <strong>${t.floodRisk}</strong>
                ${climate.flood_risk}
            </p>

            <p>
                <strong>${t.rainfallTrend}</strong>
                ${climate.rainfall_trend}
            </p>

            <p>
                <strong>${t.temperatureTrend}</strong>
                ${climate.temperature_trend}
            </p>

            <hr>

            <h3>${t.recommendedCrops}</h3>

            <ul>
                ${climate.recommended_crops
                    .map(crop => `<li>${crop}</li>`)
                    .join("")}
            </ul>

            <h3>${t.recommendedPractices}</h3>

            <ul>
                ${climate.recommended_practices
                    .map(practice => `<li>${practice}</li>`)
                    .join("")}
            </ul>

            <br>

            <button onclick="location.reload()">
                ${t.analyseAnother}
            </button>

        `;

    } catch (error) {

        console.error(error);

        results.innerHTML = `
            <h2>${t.connectionErrorTitle}</h2>
            <p>${t.connectionErrorText}</p>
        `;
    }
});

</script>

</body>
</html>
