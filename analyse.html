<!DOCTYPE html>
<html>
<head>
    <title>AgriSmart Botswana - Analyse My Farm</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: -1;
        }

        header,
        section,
        footer {
            background: rgba(0,0,0,0.5);
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
        }

        h1, h2, h3 {
            color: #ffd700;
        }

        select,
        input {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        input[type="submit"] {
            cursor: pointer;
            background: #ffd700;
            font-weight: bold;
        }

        a {
            color: #00ffcc;
            text-decoration: none;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 5px 0;
        }

        #results {
            display: none;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #ffd700;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Analyse My Farm</h1>
</header>

<section>

    <form id="farmForm">

        <label>
            District:
        </label>

        <select id="district">

            <option>Kgalagadi</option>
            <option>Ghanzi</option>
            <option>Chobe</option>
            <option>North West</option>
            <option>Central</option>
            <option>Southern</option>
            <option>Kweneng</option>
            <option>Kgatleng</option>
            <option>South East</option>
            <option>North East</option>
            <option>Northern</option>

        </select>

        <br><br>

        <input type="submit" value="Analyse Farm">

    </form>

</section>

<section id="results"></section>

<footer>
    <a href="index.html">Home</a> |
    <a href="calendar.html">Farming Calendar</a>
</footer>

<script>

async function analyseFarm(district) {

    const response = await fetch(
        "https://agrismart-1-t47g.onrender.com/analyse",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                district: district
            })
        }
    );

    return await response.json();
}

document.getElementById("farmForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const district =
        document.getElementById("district").value;

    const results =
        document.getElementById("results");

    results.style.display = "block";

    results.innerHTML =
        "<h2>Analysing climate data...</h2>";

    try {

        const climate =
            await analyseFarm(district);

        if (climate.error) {

            results.innerHTML = `
                <h2>Error</h2>
                <p>${climate.error}</p>
            `;

            return;
        }

        results.innerHTML = `

            <h2>${climate.district}</h2>

            <h3>Climate Summary</h3>

            <p>${climate.summary}</p>

            <hr>

            <p>
                <strong>Years Analysed:</strong>
                ${climate.years_analysed}
            </p>

            <p>
                <strong>Average Rainfall:</strong>
                ${climate.average_rainfall_mm} mm
            </p>

            <p>
                <strong>Average Temperature:</strong>
                ${climate.average_temperature_c} °C
            </p>

            <p>
                <strong>Rainfall Category:</strong>
                ${climate.rainfall_category}
            </p>

            <p>
                <strong>Temperature Category:</strong>
                ${climate.temperature_category}
            </p>

            <p>
                <strong>Drought Risk:</strong>
                ${climate.drought_risk}
            </p>

            <p>
                <strong>Heat Risk:</strong>
                ${climate.heat_risk}
            </p>

            <p>
                <strong>Rainfall Trend:</strong>
                ${climate.rainfall_trend}
            </p>

            <p>
                <strong>Temperature Trend:</strong>
                ${climate.temperature_trend}
            </p>

            <hr>

            <h3>Recommended Crops</h3>

            <ul>
                ${climate.recommended_crops
                    .map(crop => `<li>${crop}</li>`)
                    .join("")}
            </ul>

            <h3>Recommended Farming Practices</h3>

            <ul>
                ${climate.recommended_practices
                    .map(practice => `<li>${practice}</li>`)
                    .join("")}
            </ul>

            <br>

            <button onclick="location.reload()">
                Analyse Another District
            </button>

        `;

    } catch (error) {

        console.error(error);

        results.innerHTML = `
            <h2>Connection Error</h2>
            <p>Could not connect to the AgriSmart analysis service.</p>
        `;
    }
});

</script>

</body>
</html>
