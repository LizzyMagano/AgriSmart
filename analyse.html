<!DOCTYPE html>
<html>
<head>
  <title>AgriSmart Botswana - Analyse My Farm</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; color:#fff; text-align:center;
      background-image:url('images/background.jpg'); background-size:cover;
      background-position:center; background-attachment:fixed; }
    body::before { content:""; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.4); z-index:-1; }
    header,section,footer { background:rgba(0,0,0,0.5); margin:20px; padding:15px; border-radius:10px; }
    h1,h2 { color:#ffd700; }
    label { display:block; margin:10px 0; }
    input,select { padding:5px; margin:5px; }
    a { color:#00ffcc; text-decoration:none; margin:0 10px; }
    ul { list-style:none; padding:0; }
    li { margin:5px 0; }
  </style>
</head>
<body>
  <header id="pageHeader">
    <h1>🔍 Analyse My Farm</h1>
  </header>

  <!-- Farm Analysis Form -->
  <section id="formSection">
    <form id="farmForm">
      <label>District:
        <select id="district">
          <option>Kweneng</option>
          <option>Southern</option>
          <option>Central</option>
          <option>Northern</option>
          <option>South East</option>
          <option>Kgatleng</option>
          <option>North East</option>
          <option>North West</option>
          <option>Chobe</option>
          <option>Ghanzi</option>
          <option>Kgalagadi</option>
        </select>
      </label>
      <input type="submit" value="Analyse Farm">
    </form>
  </section>

  <!-- Results Section -->
  <section id="results" style="display:none;"></section>

  <footer id="pageFooter">
    <a href="index.html">🏠 Home</a> | <a href="calendar.html">📅 Farming Calendar</a>
  </footer>

  <script>
    // Supabase connection details
    const SUPABASE_URL = "https://imewpqufkvhwzxjbspfe.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_urW9_MF4ZO3kN4u6apAvdw_NMqjG8cD"; // ✅ publishable anon key only

    // Fetch all climate records for a district and compute averages
    async function getClimateAverage(district) {
      const response = await fetch(`${SUPABASE_URL}climate_data?district=eq.${district}`, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      });
      const data = await response.json();
      if (data.length === 0) return null;

      const totalRain = data.reduce((sum, row) => sum + row.rainfall_mm, 0);
      const totalTemp = data.reduce((sum, row) => sum + row.avg_temperature_c, 0);

      const avgRain = (totalRain / data.length).toFixed(0);
      const avgTemp = (totalTemp / data.length).toFixed(1);

      return { district, avgRain, avgTemp };
    }

    // Recommend crops based on rainfall and temperature
    function recommendCrops(avgRain, avgTemp) {
      if (avgRain < 400) {
        return {
          level: "Low Rainfall",
          crops: ["Sorghum", "Millet", "Cowpea", "Groundnut"],
          practices: ["Mulching", "Drip irrigation", "Rainwater harvesting"]
        };
      } else if (avgRain < 800) {
        return {
          level: "Average Rainfall",
          crops: ["Maize", "Sunflower", "Groundnuts", "Watermelon"],
          practices: ["Crop rotation", "Compost application", "Moderate irrigation"]
        };
      } else {
        return {
          level: "High Rainfall",
          crops: ["Rice", "Cassava", "Wet-tolerant Maize", "Vegetables"],
          practices: ["Raised beds", "Drainage channels", "Disease monitoring"]
        };
      }
    }

    // Handle form submission
    document.getElementById("farmForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      // Hide header, form, and footer
      document.getElementById("pageHeader").style.display = "none";
      document.getElementById("formSection").style.display = "none";
      document.getElementById("pageFooter").style.display = "none";

      // Show results section
      document.getElementById("results").style.display = "block";

      // Get selected district
      const district = document.getElementById("district").value;

      // Fetch climate averages from Supabase
      const climate = await getClimateAverage(district);

      if (!climate) {
        document.getElementById("results").innerHTML =
          `<h2>No climate data found for ${district}</h2>`;
        return;
      }

      // Get recommendations
      const rec = recommendCrops(climate.avgRain, climate.avgTemp);

      // Show climate info + recommendations
      document.getElementById("results").innerHTML =
        `<h2>District: ${district}</h2>
         <h2>Average Rainfall (2019–2026): ${climate.avgRain} mm</h2>
         <h2>Average Temperature: ${climate.avgTemp} °C</h2>
         <p>Rainfall Level: ${rec.level}</p>
         <h2>🌱 Recommended Crops</h2>
         <ul>${rec.crops.map(c => `<li>${c}</li>`).join("")}</ul>
         <h2>💧 Suggested Practices</h2>
         <ul>${rec.practices.map(p => `<li>${p}</li>`).join("")}</ul>`;
    });
  </script>
</body>
</html>
