<!DOCTYPE html>
<html>
<head>
  <title>AgriSmart Botswana - Analyse My Farm</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; color:#fff; text-align:center;
      background-image:url('images/background.jpg'); background-size:cover;
      background-position:center; background-attachment:fixed; }
    body::before { content:""; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.4); z-index:-1; }
    header,section,footer { background:rgba(0,0,0,0.5); margin:20px; padding:15px; border-radius:10px; }
    h1,h2 { color:#ffd700; }
    label { display:block; margin:10px 0; }
    input,select { padding:5px; margin:5px; }
    a { color:#00ffcc; text-decoration:none; margin:0 10px; }
    ul { list-style:none; padding:0; }
    li { margin:5px 0; }
  </style>
</head>
<body>
  <header>
    <h1>🔍 Analyse My Farm</h1>
  </header>

  <!-- Farm Analysis Form -->
  <section>
    <form id="farmForm">
      <label>Rainfall Level:
        <select id="rainfall">
          <option>Low</option>
          <option>Average</option>
          <option>High</option>
        </select>
      </label>
      <input type="submit" value="Analyse Farm">
    </form>
  </section>

  <!-- Results Section -->
  <section id="results"></section>

  <footer>
    <a href="index.html">🏠 Home</a> | <a href="calendar.html">📅 Farming Calendar</a>
  </footer>

  <script>
    // Supabase connection details
    const SUPABASE_URL = "https://imewpqufkvhwzxjbspfe.supabase.co/rest/v1/";
    const SUPABASE_KEY ="sb_publishable_urW9_MF4ZO3kN4u6apAvdw_NMqjG8cD"; 

    // Fetch crops by rainfall level
    async function getCrops(level) {
      const response = await fetch(`${SUPABASE_URL}crops_by_rainfall?rainfall_level=eq.${level}`, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      });
      const data = await response.json();

      // Build results HTML
      let html = `<h2>${level} Rainfall Crops</h2><ul>`;
      data.forEach(crop => {
        html += `<li><b>${crop.crop_name}</b> – ${crop.water_management}</li>`;
      });
      html += "</ul>";
      document.getElementById("results").innerHTML = html;
    }

    // Handle form submission
    document.getElementById("farmForm").addEventListener("submit", function(e) {
      e.preventDefault(); // stop page reload
      let level = document.getElementById("rainfall").value;
      getCrops(level); // fetch crops from Supabase
    });
  </script>
</body>
</html>
