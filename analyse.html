<!DOCTYPE html>
<html>
<head>
    <title>AgriSmart Botswana - Analyse My Farm</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: -1;
        }

        header,
        section,
        footer {
            background: rgba(0,0,0,0.5);
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
        }

        h1, h2, h3 {
            color: #ffd700;
        }

        select,
        input {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        input[type="submit"] {
            cursor: pointer;
            background: #ffd700;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            background: #ffd700;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }

        a {
            color: #00ffcc;
            text-decoration: none;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 5px 0;
        }

        #results {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Analyse My Farm</h1>
</header>

<section>

    <form id="farmForm">

        <label>Language:</label>

        <select id="language">
            <option value="en">English</option>
            <option value="tn">Setswana</option>
        </select>

        <br><br>

        <label>District:</label>

        <select id="district">
            <option>Kgalagadi</option>
            <option>Ghanzi</option>
            <option>Chobe</option>
            <option>North West</option>
            <option>Central</option>
            <option>Southern</option>
            <option>Kweneng</option>
            <option>Kgatleng</option>
            <option>South East</option>
            <option>North East</option>
            <option>Northern</option>
        </select>

        <br><br>

        <input type="submit" value="Analyse Farm">

    </form>

</section>

<section id="results"></section>

<footer>
    <a href="index.html">Home</a> |
    <a href="calendar.html">Farming Calendar</a>
</footer>

<script>

function translateToSetswana(text) {

    const translations = {

        "High Rainfall": "Pula e Ntsi",
        "Moderate Rainfall": "Pula e mo Magareng",
        "Low Rainfall": "Pula e Nnye",

        "High Temperature": "Mocheso o Godimo",
        "Moderate Temperature": "Mocheso o mo Magareng",
        "Low Temperature": "Mocheso o kwa Tlase",

        "High Risk": "Kotsi e Kgolwane",
        "Moderate Risk": "Kotsi e mo Magareng",
        "Low Risk": "Kotsi e Nnye",

        "Increasing": "E a Oketsega",
        "Decreasing": "E a Fokotsega",
        "Stable": "E Tsitsitse",

        "Maize": "Mmidi",
        "Sorghum": "Mabele",
        "Millet": "Lebelebele",
        "Beans": "Dinawa"
    };

    let translated = text;

    for (const key in translations) {
        translated = translated.replaceAll(
            key,
            translations[key]
        );
    }

    return translated;
}

function speakText(text) {

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "tn-ZA";
    speech.rate = 0.9;

    window.speechSynthesis.speak(speech);
}

async function analyseFarm(district) {

    const response = await fetch(
        "https://agrismart-1-t47g.onrender.com/analyse",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                district: district
            })
        }
    );

    return await response.json();
}

document
.getElementById("farmForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const district =
        document.getElementById("district").value;

    const language =
        document.getElementById("language").value;

    const results =
        document.getElementById("results");

    results.style.display = "block";

    results.innerHTML =
        "<h2>Analysing farm conditions...</h2>";

    try {

        const climate =
            await analyseFarm(district);

        if (climate.error) {

            results.innerHTML = `
                <h2>Error</h2>
                <p>${climate.error}</p>
            `;

            return;
        }

        if (language === "tn") {

            climate.ai_advice =
                translateToSetswana(climate.ai_advice);

            climate.rainfall_category =
                translateToSetswana(climate.rainfall_category);

            climate.temperature_category =
                translateToSetswana(climate.temperature_category);

            climate.drought_risk =
                translateToSetswana(climate.drought_risk);

            climate.heat_risk =
                translateToSetswana(climate.heat_risk);

            climate.flood_risk =
                translateToSetswana(climate.flood_risk);

            climate.rainfall_trend =
                translateToSetswana(climate.rainfall_trend);

            climate.temperature_trend =
                translateToSetswana(climate.temperature_trend);

            climate.recommended_crops =
                climate.recommended_crops.map(
                    crop => translateToSetswana(crop)
                );

            climate.recommended_practices =
                climate.recommended_practices.map(
                    item => translateToSetswana(item)
                );
        }

        const labels = language === "tn"
            ? {
                advice: "Kgakololo ya Temo",
                years: "Dingwaga Tse di Sekasekilweng",
                rainfall: "Boemo jwa Pula",
                temperature: "Boemo jwa Mocheso",
                drought: "Kotsi ya Leuba",
                heat: "Kotsi ya Mocheso",
                flood: "Kotsi ya Merwalela",
                raintrend: "Tsela ya Pula",
                temptrend: "Tsela ya Mocheso",
                crops: "Dijalo Tse di Kgothalediwang",
                practices: "Mekgwa ya Temo e e Kgothalediwang",
                analyse: "Sekaseka Kgaolo e Nngwe",
                read: "🔊 Buisa Kgakololo"
            }
            : {
                advice: "AI Farm Advice",
                years: "Years Analysed",
                rainfall: "Rainfall Conditions",
                temperature: "Temperature Conditions",
                drought: "Drought Risk",
                heat: "Heat Risk",
                flood: "Flood Risk",
                raintrend: "Rainfall Trend",
                temptrend: "Temperature Trend",
                crops: "Recommended Crops",
                practices: "Recommended Farming Practices",
                analyse: "Analyse Another District",
                read: "🔊 Read Advice"
            };

        results.innerHTML = `

            <h2>${climate.district}</h2>

            <h3>${labels.advice}</h3>

            <p>${climate.ai_advice}</p>

            <button onclick="speakText(\`${climate.ai_advice}\`)">
                ${labels.read}
            </button>

            <hr>

            <p>
                <strong>${labels.years}:</strong>
                ${climate.years_analysed}
            </p>

            <p>
                <strong>${labels.rainfall}:</strong>
                ${climate.rainfall_category}
            </p>

            <p>
                <strong>${labels.temperature}:</strong>
                ${climate.temperature_category}
            </p>

            <p>
                <strong>${labels.drought}:</strong>
                ${climate.drought_risk}
            </p>

            <p>
                <strong>${labels.heat}:</strong>
                ${climate.heat_risk}
            </p>

            <p>
                <strong>${labels.flood}:</strong>
                ${climate.flood_risk}
            </p>

            <p>
                <strong>${labels.raintrend}:</strong>
                ${climate.rainfall_trend}
            </p>

            <p>
                <strong>${labels.temptrend}:</strong>
                ${climate.temperature_trend}
            </p>

            <hr>

            <h3>${labels.crops}</h3>

            <ul>
                ${climate.recommended_crops
                    .map(crop => `<li>${crop}</li>`)
                    .join("")}
            </ul>

            <h3>${labels.practices}</h3>

            <ul>
                ${climate.recommended_practices
                    .map(practice => `<li>${practice}</li>`)
                    .join("")}
            </ul>

            <br>

            <button onclick="location.reload()">
                ${labels.analyse}
            </button>
        `;

    }
    catch(error) {

        console.error(error);

        results.innerHTML = `
            <h2>Connection Error</h2>
            <p>Could not connect to AgriSmart services.</p>
        `;
    }

});

</script>

</body>
</html>
