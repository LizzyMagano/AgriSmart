<!DOCTYPE html>
<html>
<head>
  <title>AgriSmart Botswana Farm Analysis</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; color:#fff; text-align:center;
      background-image:url('farm_background.jpg'); background-size:cover;
      background-position:center; background-attachment:fixed; }
    body::before { content:""; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.4); z-index:-1; }
    header,section,footer { background:rgba(0,0,0,0.5); margin:20px; padding:15px; border-radius:10px; }
    h1,h2 { color:#ffd700; }
    label { display:block; margin:10px 0; }
    input,select { padding:5px; margin:5px; }
    a { color:#00ffcc; text-decoration:none; margin:0 10px; }
  </style>
</head>
<body>
  <header>
    <h1>🔍 Analyse My Farm</h1>
  </header>
  <section>
    <form action="results.html" method="post">
      <label>District:
        <select>
          <option>Kweneng</option>
          <option>Southern</option>
          <option>Central</option>
        <option>Northern</option>
          <option>South East</option>
          <option>Kgatleng</option>
          <option>North East</option>
          <option>North West</option>
        <option>Chobe</option>
          <option>Ghanzi</option>
          <option>Kgalagadi</option>
          <option></option>
        </select>
      </label>
      <label>Soil Type:
        <select><option>Sandy</option><option>Clay</option><option>Loam</option></select>
      </label>
      <label>Crop:
        <select><option>Maize</option><option>Sorghum</option><option>Millet</option>
        <option>Sweetreed</option><option>Watermelon</option><option>Sunflower</option><option>Groundnuts</option></select>
      </label>
      <label>Season/Month: <input type="text" name="season"></label>
      <input type="submit" value="Analyse Farm">
    </form>
  </section>
  <footer>
    <a href="index.html">🏠 Home</a> | <a href="calendar.html">📅 Farming Calendar</a>
  </footer>
</body>
</html>
