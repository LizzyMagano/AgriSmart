<!DOCTYPE html>
<html>
<head>
  <title>AgriSmart Botswana - Analyse My Farm</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; color:#fff; text-align:center;
      background-image:url('images/background.jpg'); background-size:cover;
      background-position:center; background-attachment:fixed; }
    body::before { content:""; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.4); z-index:-1; }
    header,section,footer { background:rgba(0,0,0,0.5); margin:20px; padding:15px; border-radius:10px; }
    h1,h2 { color:#ffd700; }
    label { display:block; margin:10px 0; }
    input,select { padding:5px; margin:5px; }
    a { color:#00ffcc; text-decoration:none; margin:0 10px; }
    ul { list-style:none; padding:0; }
    li { margin:5px 0; }
  </style>
</head>
<body>
  <header id="pageHeader">
    <h1>🔍 Analyse My Farm</h1>
  </header>

  <!-- Farm Analysis Form -->
  <section id="formSection">
    <form id="farmForm">
      <label>District:
        <select id="district">
          <option>Kweneng</option>
          <option>Southern</option>
          <option>Central</option>
          <option>Northern</option>
          <option>South East</option>
          <option>Kgatleng</option>
          <option>North East</option>
          <option>North West</option>
          <option>Chobe</option>
          <option>Ghanzi</option>
          <option>Kgalagadi</option>
        </select>
      </label>
      <input type="submit" value="Analyse Farm">
    </form>
  </section>

  <!-- Results Section -->
  <section id="results" style="display:none;"></section>

  <footer id="pageFooter">
    <a href="index.html">🏠 Home</a> | <a href="calendar.html">📅 Farming Calendar</a>
  </footer>

  <script>
    // Supabase connection details
    const SUPABASE_URL = "https://imewpqufkvhwzxjbspfe.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_urW9_MF4ZO3kN4u6apAvdw_NMqjG8cD"; // ✅ publishable anon key only

    // Fetch crops by rainfall level from Supabase
    async function getCrops(level) {
      const response = await fetch(`${SUPABASE_URL}crops_by_rainfall?rainfall_level=eq.${level}`, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      });
      const data = await response.json();

      // Build crops HTML
      let html = `<h2>${level} Rainfall Crops</h2><ul>`;
      data.forEach(crop => {
        html += `<li><b>${crop.crop_name}</b> – ${crop.water_management}</li>`;
      });
      html += "</ul>";
      document.getElementById("results").innerHTML += html;
    }

    // Fetch rainfall & temperature from Open-Meteo
    async function getWeather() {
      const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=-24.65&longitude=25.91&yearly=temperature_2m,rain_sum");
      const data = await response.json();

      let rain = data.yearly.rain_sum[0];
      let temp = data.yearly.temperature_2m[0];

      // Classify rainfall
      let level = "";
      if (rain < 400) level = "Low";
      else if (rain < 800) level = "Average";
      else level = "High";

      // Show weather info
      document.getElementById("results").innerHTML =
        `<h2>Expected Rainfall: ${rain} mm</h2>
         <h2>Expected Temperature: ${temp} °C</h2>
         <p>Rainfall Level: ${level}</p>`;

      // Fetch crops for that rainfall level
      getCrops(level);
    }

    // Handle form submission
    document.getElementById("farmForm").addEventListener("submit", function(e) {
      e.preventDefault(); // stop page reload

      // Hide header, form, and footer
      document.getElementById("pageHeader").style.display = "none";
      document.getElementById("formSection").style.display = "none";
      document.getElementById("pageFooter").style.display = "none";

      // Show results section
      document.getElementById("results").style.display = "block";

      // Fetch rainfall + crops automatically
      getWeather();
    });
  </script>
</body>
</html>
