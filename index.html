<head>
  <title>AgriSmart Botswana - Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;

      /* Farm background */
      background-image: url('farm_background.jpg'); /* Replace with your farm/crops image */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Overlay for readability */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    header {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
      margin: 20px;
    }

    h1 {
      color: #ffd700; /* golden highlight */
    }

    /* Vertical button styling */
    nav {
      display: flex;
      flex-direction: column; /* stack vertically */
      align-items: center;
      margin: 20px;
    }

    nav a {
      background: rgba(0, 0, 0, 0.6);
      color: #00ffcc;
      text-decoration: none;
      padding: 15px;
      margin: 10px;
      width: 250px;
      border-radius: 8px;
      font-size: 18px;
      transition: background 0.3s;
    }

    nav a:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
